<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الفرصة | فرصتي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="brand">
            <span class="logo">ف</span>
            <span>فرصتي</span>
        </a>
        <a class="nav-cta" href="index.html">الرئيسية</a>
    </header>

    <main class="container article-page">
        <a href="index.html" class="back-link" style="display:inline-block; margin-bottom:20px; font-weight:bold;">← الرجوع للرئيسية</a>
        
        <h1 id="articleTitle" style="color:#1e3a8a; margin-bottom:10px;">جاري تحميل المقال...</h1>
        <p id="articleDescription" style="color:#4b5563; font-size:18px; margin-bottom:20px;"></p>

        <!-- الإطار الأحمر لعرض PDF أو الإعلان الأصلي -->
        <div class="original-offer-box">
            <div class="original-offer-badge"><span>🔴</span> الإعلان الأصلي (PDF)</div>
            <div id="articleOriginalText" style="margin-top:20px; font-weight:bold; color:#7f1d1d;">جاري تحميل المرفق...</div>
        </div>

        <div class="article-content" style="margin-top:40px;">
            <h2 style="color:#1e3a8a; border-bottom:2px solid #e5e7eb; padding-bottom:10px;">📋 الشروط المطلوبة</h2>
            <ul id="articleRequirements" style="line-height:2; margin-bottom:30px;"></ul>

            <h2 style="color:#1e3a8a; border-bottom:2px solid #e5e7eb; padding-bottom:10px;">💰 المميزات</h2>
            <ul id="articleBenefits" style="line-height:2; margin-bottom:30px;"></ul>

            <div style="background-color:#eff6ff; padding:20px; border-radius:8px; text-align:center; margin-top:40px;">
                <p style="margin-bottom:15px; font-weight:bold;">يُرجى قراءة الإعلان الأصلي في الأعلى بعناية، ثم التقديم من الرابط الرسمي:</p>
                <a href="#" target="_blank" id="applyLink" style="background-color:#2563eb; color:white; padding:12px 30px; border-radius:8px; text-decoration:none; font-weight:bold; display:inline-block;">🔗 التقديم الرسمي من هنا</a>
            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyuskkfJ5nxLnupqF75P8gqW6yWyq-CDa2DiI0HsAO11v-XhhhX8HYk1Io--zbzAcUH/exec";
        async function loadArticle() {
            const id = new URLSearchParams(window.location.search).get("id");
            try {
                const res = await fetch(API_URL);
                const article = (await res.json()).find(item => String(item.id) === String(id));
                if (!article) return;

                document.title = article.title + " | فرصتي";
                document.getElementById("articleTitle").textContent = article.title;
                document.getElementById("articleDescription").textContent = article.description;

                const originalBox = document.getElementById("articleOriginalText");
                const details = String(article.details).trim();
                if (details.startsWith("http")) {
                    if (details.match(/\.(jpeg|jpg|png)$/i)) originalBox.innerHTML = `<img src="${details}" style="width:100%; border-radius:8px;">`;
                    else originalBox.innerHTML = `<iframe src="https://docs.google.com/viewer?url=${encodeURIComponent(details)}&embedded=true" width="100%" height="700px" style="border:none; border-radius:8px;"></iframe>`;
                } else {
                    originalBox.textContent = details;
                }

                const reqList = document.getElementById("articleRequirements");
                article.requirements.forEach(req => reqList.innerHTML += `<li>${req}</li>`);
                const benList = document.getElementById("articleBenefits");
                article.benefits.forEach(ben => benList.innerHTML += `<li>${ben}</li>`);
                
                document.getElementById("applyLink").href = article.officialLink;
            } catch (e) { document.getElementById("articleTitle").textContent = "خطأ في التحميل"; }
        }
        loadArticle();
    </script>
</body>
</html>
