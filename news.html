<script>
async function loadArticle() {
  try {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    // تم تحديث الرابط هنا أيضاً
    const res = await fetch("https://script.google.com/macros/s/AKfycby0OcWta_DLcycnumAyT_4kY79IOeJpsx6pAa1SJur4Dgr1zj90yPm--_k1zjtyqC6R/exec");
    const data = await res.json();

    const article = data.find(item => String(item.id) === String(id));

    if (!article) {
      document.getElementById("articleTitle").textContent = "المقال غير موجود";
      document.getElementById("articleDescription").textContent = "لم يتم العثور على هذه الفرصة.";
      return;
    }

    document.title = article.title + " | فرصتي";

    document.getElementById("articleTag").textContent = article.tag;
    document.getElementById("articleTitle").textContent = article.title;
    document.getElementById("articleDescription").textContent = article.description;

    document.getElementById("articleDate").textContent = "📅 تاريخ النشر: " + article.date;
    document.getElementById("articleCategory").textContent = "🏷️ التصنيف: " + article.tag;
    document.getElementById("articleCountry").textContent = "🌍 الدولة: " + article.country;
    document.getElementById("articleDeadline").textContent = "⏳ آخر أجل: " + article.deadline;

    document.getElementById("infoCountry").textContent = article.country;
    document.getElementById("infoStatus").textContent = article.status;

    document.getElementById("articleIntro").textContent = article.intro;
    document.getElementById("articleDetails").textContent = article.details;
    document.getElementById("articleHowToApply").textContent = article.howToApply;

    const reqList = document.getElementById("articleRequirements");
    reqList.innerHTML = "";
    article.requirements.forEach(req => {
      const li = document.createElement("li");
      li.textContent = req;
      reqList.appendChild(li);
    });

    const benList = document.getElementById("articleBenefits");
    benList.innerHTML = "";
    article.benefits.forEach(ben => {
      const li = document.createElement("li");
      li.textContent = ben;
      benList.appendChild(li);
    });

    document.getElementById("applyLink").href = article.officialLink;
    document.getElementById("sideApplyLink").href = article.officialLink;
    document.getElementById("sideType").textContent = article.tag;

  } catch (error) {
    console.error(error);
    document.getElementById("articleTitle").textContent = "حدث خطأ في تحميل المقال";
  }
}

loadArticle();
</script>
