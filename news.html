<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الإعلان | JoobBank</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .news-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; min-height: 70vh; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: #fff; font-weight: 700; margin-bottom: 20px; padding: 12px 25px; background: #004b87; border-radius: 50px; text-decoration: none; transition: 0.3s; }
        .back-btn:hover { background: #cc9933; transform: translateX(5px); }
        .details-card { background: #fff; border-radius: 16px; padding: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #cc9933; }
        .details-title { color: #004b87; font-size: 1.8rem; font-weight: 800; margin-bottom: 25px; }
        .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 35px; padding: 25px; background: #f9f9f9; border-radius: 12px; }
        .info-label { display: block; font-size: 0.85rem; color: #777; margin-bottom: 5px; }
        .info-value { display: block; font-size: 1.1rem; color: #333; font-weight: 700; }
        .official-link-box { text-align: center; margin: 30px 0; padding: 20px; border: 2px dashed #cc9933; border-radius: 12px; }
        .btn-direct { background: #cc9933; color: white; padding: 15px 30px; border-radius: 8px; text-decoration: none; font-weight: 800; display: inline-block; transition: 0.3s; }
        .btn-direct:hover { background: #004b87; transform: scale(1.05); }
        .content-section { line-height: 1.8; color: #444; margin-bottom: 30px; }
        .content-section h3 { color: #004b87; border-right: 4px solid #cc9933; padding-right: 10px; margin: 25px 0 15px; }
        .pdf-frame { width: 100%; height: 600px; border: 1px solid #ddd; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>

    <main class="news-container">
        <a href="index.html" class="back-btn">← العودة للرئيسية</a>
        <div id="jobDetailsContent">
            <p style="text-align:center;">جاري تحميل تفاصيل الفرصة...</p>
        </div>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxIliIDLQ1JaKdpQhpKSAlMoS0OXr3Rvx04eaLWxGLfFU7hIfJQQVEp4jb0XTl28glH/exec";

        async function loadJobDetails() {
            const container = document.getElementById('jobDetailsContent');
            const urlParams = new URLSearchParams(window.location.search);
            const jobId = urlParams.get('id');

            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                const job = data.find(item => String(item.id) === String(jobId));

                if (!job) {
                    container.innerHTML = "<h2>عذراً، لم يتم العثور على الإعلان.</h2>";
                    return;
                }

                // جلب الرابط الرسمي (العمود O في شيتك)
                const officialLink = job.officiallink || job.officialLink || job.link || "#";

                container.innerHTML = `
                    <div class="details-card">
                        <h1 class="details-title">${job.title}</h1>
                        
                        <div class="meta-grid">
                            <div><span class="info-label">القطاع</span><span class="info-value">${job.category || 'عام'}</span></div>
                            <div><span class="info-label">تاريخ النشر</span><span class="info-value">${job.publish || job.date || 'جديد'}</span></div>
                            <div><span class="info-label">النوع</span><span class="info-value">${job.tag || 'وظيفة'}</span></div>
                        </div>

                        <div class="content-section">
                            <h3>وصف الإعلان:</h3>
                            <p>${job.introdetails || 'تفاصيل الإعلان متوفرة في الرابط الرسمي.'}</p>
                            
                            <h3>الشروط والمؤهلات:</h3>
                            <p>${job.requirements || 'يرجى مراجعة نص الإعلان الأصلي.'}</p>
                        </div>

                        <div class="official-link-box">
                            <p>للتقديم أو الاطلاع على الملف الأصلي للمباراة:</p>
                            <a href="${officialLink}" target="_blank" class="btn-direct">اضغط هنا لزيارة الرابط الرسمي</a>
                        </div>

                        <h3>ملف الإعلان (PDF):</h3>
                        <iframe class="pdf-frame" src="${officialLink}"></iframe>
                    </div>
                `;
            } catch (error) {
                container.innerHTML = "<h2>حدث خطأ أثناء جلب البيانات.</h2>";
            }
        }
        document.addEventListener("DOMContentLoaded", loadJobDetails);
    </script>
</body>
</html>
